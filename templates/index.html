<!DOCTYPE html>
<html>

<head>
    <title>Game Outcome Predictor</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .lol-logo {
            display: block;
            margin: auto;
            width: 340px;
            margin-bottom: 10px;
            filter: drop-shadow(0px 0px 15px gold);
        }

        /* ===== BACKGROUND SYSTEM ===== */

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 2s ease-in-out, transform 10s ease;
            z-index: -3;
            opacity: 0;
        }

        .bg-layer.active {
            opacity: 1;
        }

        .bg-layer.zoom {
            transform: scale(1.08);
        }

        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom right,
                    rgba(0, 0, 0, 0.75),
                    rgba(20, 0, 40, 0.6));
            z-index: -2;
        }

        /* ===== GLASS CARD ===== */

        .container {
            width: 480px;
            padding: 45px;
            background: rgba(15, 15, 25, 0.85);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow:
                0 0 30px rgba(168, 85, 247, 0.7),
                0 0 80px rgba(139, 92, 246, 0.4);
            transition: 0.4s ease;
        }

        h1 {
            text-align: center;
            color: #c084fc;
            margin-bottom: 30px;
            text-shadow: 0 0 25px #a855f7;
            font-size: 28px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            background: rgba(30, 30, 40, 0.9);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px #9333ea;
            background: rgba(50, 50, 60, 0.95);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 25px #9333ea;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #c084fc;
        }

        /* ===== RESULT ===== */

        .result {
            text-align: center;
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        .blue-win {
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
        }

        .red-win {
            color: #ff4d4d;
            text-shadow: 0 0 20px red;
        }

        .stats {
            margin-top: 15px;
            text-align: center;
            font-size: 15px;
            color: #e5e7eb;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Dual Background Layers -->
    <div class="bg-layer" id="bg1"></div>
    <div class="bg-layer" id="bg2"></div>
    <div class="overlay"></div>

    <div class="container">
        <img src="{{ url_for('static', filename='lol.png') }}" class="lol-logo">
        <h1>🎮 Game Outcome Predictor</h1>

        <form id="predictionForm">
            <input name="gold" placeholder="Gold Difference" required>
            <input name="xp" placeholder="XP Difference" required>
            <input name="kills" placeholder="Kills" required>
            <input name="dragons" placeholder="Dragons Taken" required>
            <input name="towers" placeholder="Towers Destroyed" required>
            <button type="submit">Predict Winner</button>
        </form>

        {% if prediction_text %}
        {% if "BLUE" in prediction_text %}
        <div class="result blue-win">{{ prediction_text }}</div>
        {% else %}
        <div class="result red-win">{{ prediction_text }}</div>
        {% endif %}

        <div class="stats">
            Confidence: {{prob}}%<br>
            Model Used: {{model_name}}<br>
            Model Accuracy: {{accuracy*100}}%
        </div>
        {% endif %}
    </div>

    <script>

        const form = document.getElementById("predictionForm");

        /* =========================
           Prediction Form Logic
           ========================= */

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            fetch("/predict", {
                method: "POST",
                body: formData
            })
                .then(res => res.json())
                .then(data => {

                    let result = document.querySelector(".result");
                    let stats = document.querySelector(".stats");

                    if (!result) {
                        result = document.createElement("div");
                        result.className = "result";
                        document.querySelector(".container").appendChild(result);
                    }

                    if (!stats) {
                        stats = document.createElement("div");
                        stats.className = "stats";
                        document.querySelector(".container").appendChild(stats);
                    }

                    result.textContent = data.result;

                    result.className =
                        data.result.includes("BLUE")
                            ? "result blue-win"
                            : "result red-win";

                    stats.innerHTML = `
        Confidence: ${data.prob}%<br>
        Model Used: ${data.model_name}<br>
        Model Accuracy: ${data.accuracy}%
        `;
                });

        });


        /* =========================
           Background Image System
           ========================= */

        const images = [
            "{{ url_for('static', filename='league.jpg') }}",
            "{{ url_for('static', filename='league2.jpg') }}",
            "{{ url_for('static', filename='league3.jpg') }}",
            "{{ url_for('static', filename='league4.jpeg') }}"
        ];

        const bg1 = document.getElementById("bg1");
        const bg2 = document.getElementById("bg2");

        let currentIndex = 0;
        let currentLayer = bg1;
        let nextLayer = bg2;

        function changeBackground() {

            nextLayer.style.backgroundImage =
                `url('${images[currentIndex]}')`;

            nextLayer.classList.add("active");
            nextLayer.classList.add("zoom");

            currentLayer.classList.remove("active");
            currentLayer.classList.remove("zoom");

            let temp = currentLayer;
            currentLayer = nextLayer;
            nextLayer = temp;

            currentIndex =
                (currentIndex + 1) % images.length;
        }


        /* Initial Background */

        bg1.style.backgroundImage =
            `url('${images[0]}')`;

        bg1.classList.add("active");
        bg1.classList.add("zoom");

        currentIndex = 1;


        /* Change Every 7 Seconds */

        setInterval(changeBackground, 7000);

    </script>

</body>

</html>
